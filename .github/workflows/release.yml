# Builds installers for Windows, macOS (Apple Silicon + Intel) and Linux when a version tag is pushed,
# and attaches them to a DRAFT GitHub release for a maintainer to review and publish.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Validate version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Use an existing version tag such as v0.1.0"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxcb1-dev libxcb-randr0-dev libgbm-dev libegl1-mesa-dev libclang-dev clang
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: cargo test --workspace --locked
      - name: Fetch locked target sources for notices
        run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Generate target third-party notices
        run: node scripts/generate-third-party-notices.mjs --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Oxbox ${{ inputs.tag || github.ref_name }}'
          releaseBody: >-
            Draft prerelease for maintainer review. Builds are unsigned. Review CHANGELOG.md,
            docs/VALIDATION.md and docs/RELEASE.md at this tag, verify installer checksums, and
            complete the recorded platform, hardware, installer, security and attribution gates
            before publishing. Optional FFmpeg/Tesseract providers are not bundled.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
