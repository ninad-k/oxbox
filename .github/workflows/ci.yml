name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Legacy UI and packaging regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Check generated contributor feature index
        run: node scripts/build-community-docs.mjs --check
      - name: Verify approved dependency source backports
        run: node scripts/verify-vendor.mjs
      - name: Test dependency source integrity
        run: node --test scripts/vendor-integrity.test.mjs
      - run: node --test scripts/build-native.test.mjs scripts/license-inventory.test.mjs scripts/verify-native-installers.test.mjs scripts/macro-compat.test.mjs

  rust:
    name: Native Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libclang-dev clang
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Fetch locked target sources for metadata and notices
        run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p oxbox-core -p oxbox-native --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test -p oxbox-core -p oxbox-native --locked --target ${{ matrix.target }}
      - name: Test maintained localization configuration backport
        run: cargo test --manifest-path tests/dependency-compat/Cargo.toml --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked localization fixture sources
        run: cargo fetch --manifest-path tests/macro-compat/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Verify localization macro expansion and diagnostics
        run: node scripts/check-macro-compat.mjs --expect patched
      - name: Verify Windows third-party notices
        if: runner.os == 'Windows'
        run: node scripts/generate-third-party-notices.mjs --check
      - name: Verify runtime observer argument guards
        if: runner.os == 'Windows'
        run: node --test scripts/observe-native-endpoints.test.mjs
      - name: Build native application
        run: node scripts/build-native.mjs --target ${{ matrix.target }}
      - name: Exercise patched GLib string iterator with optimization
        if: runner.os == 'Linux'
        run: cargo test -p oxbox-native --release --locked --target ${{ matrix.target }} approved_glib_backport_string_iterator_methods

  msrv:
    name: Minimum Rust (1.95)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check -p oxbox-core -p oxbox-native --all-targets --locked --target x86_64-pc-windows-msvc
