name: Bug report
description: Something in Oxbox doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please use generated fixtures and redact personal paths/content. Report security vulnerabilities privately using SECURITY.md."
  - type: dropdown
    id: host
    attributes:
      label: Interface
      options:
        - Native desktop (eframe)
        - Legacy Tauri desktop
        - Browser preview (desktop commands unavailable)
        - GitHub Pages website
        - Installer
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool (or "launcher"/"tray")?
      placeholder: verify-checksum
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …"
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: Windows 11 24H2 / macOS 15.2 / Ubuntu 24.04 (GNOME)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Oxbox version and source commit
      placeholder: "0.1.0 native; git rev-parse HEAD or artifact SHA256"
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: "Exact error code, provider version, X11/Wayland, DPI or accessibility tool as relevant. Include redacted logs only."
