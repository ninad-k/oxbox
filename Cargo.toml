[workspace]
resolver = "3"
members = ["crates/oxbox-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ninad-k/oxbox"
homepage = "https://github.com/ninad-k/oxbox"
authors = ["Oxbox contributors"]

[workspace.dependencies]
oxbox-core = { path = "crates/oxbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Small, fast release binaries. See https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
