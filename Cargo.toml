[workspace]
resolver = "3"
members = ["crates/oxbox-core", "crates/oxbox-native", "src-tauri"]
exclude = ["vendor/glib-0.18.5", "vendor/i18n-config-0.4.8", "vendor/rxing-0.9.4"]
default-members = ["crates/oxbox-native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ninad-k/oxbox"
authors = ["Oxbox contributors"]

[workspace.dependencies]
oxbox-core = { path = "crates/oxbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = { version = "=1.0.2", default-features = false, features = ["std", "tz-system", "tz-fat", "tzdb-bundle-always", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline"] }

[patch.crates-io]
# User-approved source backports; provenance and integrity are recorded in vendor/.
glib = { path = "vendor/glib-0.18.5" }
i18n-config = { path = "vendor/i18n-config-0.4.8" }
rxing = { path = "vendor/rxing-0.9.4" }

# Compact native builds. Workers unwind so failures are reported and cleanup can run.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
