[workspace]
resolver = "3"
members = ["crates/oxbox-core", "crates/oxbox-native", "src-tauri"]
default-members = ["crates/oxbox-native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ninad-k/oxbox"
authors = ["Oxbox contributors"]

[workspace.dependencies]
oxbox-core = { path = "crates/oxbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Compact native builds. Workers unwind so failures are reported and cleanup can run.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
