[package]
name = "oxbox-core"
description = "Platform logic for every Oxbox tool. Pure Rust, no UI dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# verify-checksum
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1"
# Phase 1: offline converters, time zones and codes
jiff.workspace = true
qrcode = "0.14"
barcoders = "2"
# Phase 2: streaming file tools and safe trash
walkdir = "2"
trash = "5"
dirs = "6"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.25"
# Phase 3: local system information and power management
sysinfo = "0.37"
keepawake = "0.6"
# Phase 4: capture, image processing and passphrase encryption
xcap = "0.8"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The 0.12.1 candidate failed the security gate (ADR 0006); keep the
# existing passphrase implementation until a reviewed remedy is approved.
age = "=0.11.5"
rqrr = "0.11"
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "qrcode", "oned", "encoding_rs", "multi_barcode_readers"] }

[target.'cfg(unix)'.dependencies]
# User-approved 2026-11-22: typed waitid(WNOWAIT) and owned provider process groups.
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Shutdown", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Foundation", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
