[package]
name = "oxbox-native"
description = "Oxbox native desktop host without an embedded browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "oxbox-native"

[dependencies]
oxbox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "glow", "wayland", "x11"] }
rfd = "=0.17.2"
tray-icon = "=0.25.1"
global-hotkey = "=0.8.0"
auto-launch = "=0.6.0"
open = "=5.4.5"
raw-window-handle = "=0.6.2"
dirs = "=6.0.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "=4.19.0"
gtk = "=0.18.2"

[dev-dependencies]
tempfile = "3"
